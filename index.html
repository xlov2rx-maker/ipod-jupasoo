<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>주파수의 iPod</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
      position: fixed;
    }

    .ipod-body {
      width: 100%;
      max-width: 340px;
      height: 100%;
      max-height: 700px;
      background: linear-gradient(145deg, #ffffff, #dcdcdc);
      border-radius: 36px;
      padding: 16px 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #ccc;
      position: relative;
    }

    .ipod-screen {
      width: 100%;
      flex: 1.2;
      max-height: 380px;
      background: #ffffff;
      border: 3px solid #333;
      border-radius: 14px;
      overflow: hidden; 
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      position: relative;
    }

    .screen-header {
      background: linear-gradient(to bottom, #b0b0b0, #808080);
      color: white;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-icon { cursor: pointer; font-size: 15px; user-select: none; }

    .screen-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      align-items: center;
    }

    .player-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
      flex: 1;
    }
    
    .thumbnail-box {
      width: 150px;
      height: 150px;
      margin: 4px auto 8px;
      border: 2px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .song-title { 
      font-size: 14px; 
      font-weight: bold; 
      color: #111; 
      margin-bottom: 4px; 
      word-break: break-all; 
      padding: 0 10px; 
      line-height: 1.3; 
    }
    .status-text { font-size: 11px; color: #555; font-weight: 500; margin-bottom: 2px; }

    .reaction-bar { display: flex; justify-content: center; align-items: center; width: 100%; padding-bottom: 4px; }
    .reaction-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #000; display: flex; align-items: center; gap: 5px; font-weight: bold; }

    .modal-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.98); z-index: 20; display: none;
      flex-direction: column; padding: 14px; justify-content: flex-start; gap: 8px;
    }
    .modal-overlay.active { display: flex; }
    
    #comments-modal { background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%); }
    .comments-modal-content { display: flex; flex-direction: column; height: 100%; }
    .cute-title { font-size: 13px; font-weight: 800; text-align: center; color: #0284c7; margin-bottom: 6px; }

    .cute-input-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #bae6fd;
      box-shadow: 0 2px 6px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cute-input-container input, .cute-input-container textarea {
      border: 1px solid #7dd3fc; border-radius: 6px; padding: 6px 8px; background: #ffffff; font-size: 11px;
    }
    .cute-btn-save { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; font-weight: bold; border-radius: 6px; }
    .cute-btn-cancel { background: #94a3b8; color: white; border-radius: 6px; }
    
    .comment-list-scroll { flex: 1; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
    .cute-comment-item { background: #ffffff; padding: 8px 10px; border-radius: 8px; border: 1px solid #bae6fd; box-shadow: 0 2px 4px rgba(186, 230, 253, 0.3); font-size: 11px; }

    .comment-header { display: flex; justify-content: space-between; align-items: center; }
    .comment-author-group { display: flex; align-items: center; gap: 4px; }
    .comment-author { font-weight: bold; color: #0369a1; }
    .comment-time { font-size: 9px; color: #94a3b8; }
    .comment-actions { display: flex; gap: 4px; }
    .comment-action-btn { font-size: 9px; color: #0284c7; cursor: pointer; background: none; border: none; font-weight: 600; }
    .comment-text { color: #334155; word-break: break-all; margin: 3px 0; font-size: 11px; }
    .reply-btn { font-size: 9px; color: #38bdf8; cursor: pointer; background: none; border: none; font-weight: bold; }
    .reply-list { margin-left: 6px; margin-top: 4px; border-left: 2px solid #7dd3fc; padding-left: 6px; }

    .wheel-container { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; padding: 6px 0; }
    .click-wheel {
      width: 210px; height: 210px; background: #ffffff; border-radius: 50%; position: relative; flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2), inset 0 0 10px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; touch-action: none;
    }
    
    .wheel-btn { position: absolute; background: none; border: none; font-weight: bold; color: #555; cursor: pointer; user-select: none; }
    .btn-menu { top: 15px; left: 50%; transform: translateX(-50%); font-size: 12px; }
    .btn-prev { left: 15px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    .btn-next { right: 15px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    .btn-play-pause { bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 12px; }
    
    .center-button {
      width: 76px; height: 76px; background: linear-gradient(145deg, #e6e6e6, #ffffff);
      border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      box-shadow: 0 3px 8px rgba(0,0,0,0.2); border: 1px solid #ccc; cursor: pointer;
    }

    @media (min-width: 768px) {
      .ipod-body { max-width: 320px; max-height: 640px; padding: 12px 10px; }
      .click-wheel { width: 175px; height: 175px; }
      .center-button { width: 62px; height: 62px; }
      .thumbnail-box { width: 130px; height: 130px; }
    }

    #sc-player-container { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
  </style>
</head>
<body>

<div class="ipod-body">
  <div class="ipod-screen">
    <div class="screen-header">
      <span>주파수의 ipod</span>
      <span class="header-icon" onclick="openCommentsModal()" title="소통하기">💬</span>
    </div>

    <!-- 소통 모달 -->
    <div class="modal-overlay" id="comments-modal">
      <div class="comments-modal-content">
        <div class="cute-title">☁️ 소통 공간 ☁️</div>
        <div class="cute-input-container">
          <input type="text" id="nickname" placeholder="닉네임">
          <textarea id="comment-text" placeholder="예쁜 댓글을 남겨주세요..."></textarea>
          <div style="display: flex; gap: 6px; margin-top: 4px;">
            <button class="cute-btn-save" style="flex: 1; padding: 8px; border: none;" onclick="addComment()">작성</button>
            <button class="cute-btn-cancel" style="flex: 1; padding: 8px; border: none;" onclick="closeCommentsModal()">닫기</button>
          </div>
        </div>
        <div class="comment-list-scroll" id="comment-list"></div>
      </div>
    </div>

    <!-- 메인 플레이어 화면 -->
    <div class="screen-content">
      <div class="player-display">
        <div class="thumbnail-box">
          <img id="album-art" src="https://i1.sndcdn.com/artworks-00000000-default-t500x500.jpg" alt="Album Art">
        </div>
        <div class="song-title" id="song-title">음악 재생 준비 중...</div>
        <div class="status-text" id="status-text">▶ 터치하여 재생 대기 중...</div>
      </div>

      <div class="reaction-bar">
        <button class="reaction-btn" onclick="toggleLike()">🖤 <span id="like-count">0</span></button>
      </div>
    </div>
  </div>

  <div class="wheel-container">
    <div class="click-wheel">
      <button class="wheel-btn btn-menu" onclick="openCommentsModal()">MENU</button>
      <button class="wheel-btn btn-prev" onclick="changeVolume(-10)" title="볼륨 줄이기">🔉</button>
      <button class="wheel-btn btn-next" onclick="changeVolume(10)" title="볼륨 키우기">🔊</button>
      <button class="wheel-btn btn-play-pause" onclick="togglePlayPause()">▶II</button>
      <div class="center-button" onclick="togglePlayPause()"></div>
    </div>
  </div>
</div>

<div id="sc-player-container">
  <!-- 🎵 iframe src에 링크를 직접 박아넣어 로딩 지연을 없앴습니다 -->
  <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/forss/voodoo&auto_play=true&show_artwork=true"></iframe>
</div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
  // 🎵 https://soundcloud.com/404wave/penomeco-pt-2
  const FIXED_TRACK_URL = "https://soundcloud.com/404wave/penomeco-pt-2";

  let widget;
  let isPlaying = false;
  let likes = 0;
  let currentVolume = 50;

  window.addEventListener('load', function() {
    const iframe = document.getElementById('sc-widget');
    widget = SC.Widget(iframe);

    // 위젯이 뜨자마자 사운드 정보를 바로 가져와서 화면에 세팅
    widget.bind(SC.Widget.Events.READY, function() {
      widget.setVolume(currentVolume);
      widget.getCurrentSound(function(currentSound) {
        if (currentSound) {
          document.getElementById('song-title').textContent = currentSound.title;
          const artwork = currentSound.artwork_url ? currentSound.artwork_url.replace('-large', '-t500x500') : 'https://via.placeholder.com/150?text=No+Art';
          document.getElementById('album-art').src = artwork;
        }
      });
      tryPlayAudio();
    });

    widget.bind(SC.Widget.Events.PLAY, function() { isPlaying = true; updatePlayStatus(); });
    widget.bind(SC.Widget.Events.PAUSE, function() { isPlaying = false; updatePlayStatus(); });

    widget.bind(SC.Widget.Events.FINISH, function() {
      widget.seekTo(0);
      widget.play();
    });

    const autoPlayTrigger = function() {
      tryPlayAudio();
      window.removeEventListener('touchstart', autoPlayTrigger);
      window.removeEventListener('click', autoPlayTrigger);
      window.removeEventListener('touchend', autoPlayTrigger);
    };

    window.addEventListener('touchstart', autoPlayTrigger, { passive: true, once: true });
    window.addEventListener('click', autoPlayTrigger, { passive: true, once: true });
    window.addEventListener('touchend', autoPlayTrigger, { passive: true, once: true });
  });

  function tryPlayAudio() {
    if (widget) { widget.play(); }
  }

  function changeVolume(delta) {
    if (!widget) return;
    currentVolume = Math.min(100, Math.max(0, currentVolume + delta));
    widget.setVolume(currentVolume);

    const statusText = document.getElementById('status-text');
    statusText.textContent = `🔊 볼륨: ${currentVolume}%`;
    
    setTimeout(() => {
      updatePlayStatus();
    }, 1500);
  }

  function getFormattedDateTime() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    return `${yy}.${mm}.${dd} ${hh}:${min}`;
  }

  function openCommentsModal() {
    document.getElementById('comments-modal').classList.add('active');
  }

  function closeCommentsModal() {
    document.getElementById('comments-modal').classList.remove('active');
  }

  function togglePlayPause() {
    if (widget) widget.toggle();
  }

  function updatePlayStatus() {
    document.getElementById('status-text').textContent = isPlaying ? '▶ 재생 중...' : '⏸ 일시정지됨 (화면 터치 시 재생)';
  }

  function toggleLike() {
    likes++;
    document.getElementById('like-count').textContent = likes;
  }

  function addComment() {
    const nickname = document.getElementById('nickname').value.trim() || '익명';
    const text = document.getElementById('comment-text').value.trim();
    if (!text) return alert('댓글 내용을 입력해주세요.');

    const timeStr = getFormattedDateTime();
    const commentList = document.getElementById('comment-list');
    const commentId = 'comment-' + Date.now();
    const commentHTML = `
      <div class="cute-comment-item" id="${commentId}">
        <div class="comment-header">
          <div class="comment-author-group">
            <span class="comment-author">${escapeHtml(nickname)}</span>
            <span class="comment-time">${timeStr}</span>
          </div>
          <div class="comment-actions">
            <button class="comment-action-btn" onclick="editComment('${commentId}')">수정</button>
            <button class="comment-action-btn" onclick="deleteComment('${commentId}')">삭제</button>
          </div>
        </div>
        <div class="comment-text">${escapeHtml(text)}</div>
        <button class="reply-btn" onclick="showReplyBox('${commentId}')">답글 달기</button>
        <div class="reply-list"></div>
      </div>`;
    commentList.insertAdjacentHTML('afterbegin', commentHTML);
    document.getElementById('comment-text').value = '';
  }

  function showReplyBox(commentId) {
    const commentItem = document.getElementById(commentId);
    if (commentItem.querySelector('.reply-input-box')) return;
    const replyBoxHTML = `
      <div style="margin-top: 4px; display: flex; flex-direction: column; gap: 3px;" class="reply-input-box">
        <input type="text" class="reply-nickname" placeholder="닉네임" style="font-size: 10px; padding: 3px 5px;">
        <textarea class="reply-text" placeholder="답글 내용" style="font-size: 10px; height: 30px; padding: 3px 5px;"></textarea>
        <div style="display: flex; gap: 4px;">
          <button style="font-size: 10px; background: #38bdf8; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-weight: bold;" onclick="addReply('${commentId}')">등록</button>
          <button style="font-size: 10px; background: #94a3b8; color: white; border: none; padding: 3px 6px; border-radius: 4px;" onclick="this.parentElement.parentElement.remove()">취소</button>
        </div>
      </div>`;
    commentItem.insertAdjacentHTML('beforeend', replyBoxHTML);
  }

  function addReply(commentId) {
    const commentItem = document.getElementById(commentId);
    const nickname = commentItem.querySelector('.reply-nickname').value.trim() || '익명';
    const text = commentItem.querySelector('.reply-text').value.trim();
    if (!text) return alert('답글 내용을 입력해주세요.');

    const timeStr = getFormattedDateTime();
    const replyList = commentItem.querySelector('.reply-list');
    const replyId = 'reply-' + Date.now();
    const replyHTML = `
      <div class="cute-comment-item" id="${replyId}" style="margin-top: 4px; border-color: #e0f2fe;">
        <div class="comment-header">
          <div class="comment-author-group">
            <span class="comment-author">${escapeHtml(nickname)}</span>
            <span class="comment-time">${timeStr}</span>
          </div>
          <div class="comment-actions">
            <button class="comment-action-btn" onclick="editComment('${replyId}')">수정</button>
            <button class="comment-action-btn" onclick="deleteComment('${replyId}')">삭제</button>
          </div>
        </div>
        <div class="comment-text">${escapeHtml(text)}</div>
      </div>`;
    replyList.insertAdjacentHTML('beforeend', replyHTML);
    commentItem.querySelector('.reply-input-box').remove();
  }

  function editComment(itemId) {
    const item = document.getElementById(itemId);
    const authorSpan = item.querySelector('.comment-author');
    const textDiv = item.querySelector('.comment-text');

    if (item.querySelector('.edit-box')) return;

    const currentAuthor = authorSpan.textContent;
    const currentText = textDiv.textContent;

    const editFormHTML = `
      <div class="edit-box" style="margin-top: 4px; display: flex; flex-direction: column; gap: 4px; background: #f0f9ff; padding: 6px; border-radius: 6px; border: 1px solid #7dd3fc;">
        <input type="text" class="edit-nickname-input" value="${escapeHtml(currentAuthor)}" style="font-size: 10px; padding: 3px 5px; border: 1px solid #bae6fd; border-radius: 4px;">
        <textarea class="edit-text-input" style="font-size: 10px; height: 32px; padding: 3px 5px; border: 1px solid #bae6fd; border-radius: 4px; resize: none;">${escapeHtml(currentText)}</textarea>
        <div style="display: flex; gap: 4px; margin-top: 2px;">
          <button style="font-size: 10px; background: #0284c7; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="saveEdit('${itemId}')">완료</button>
          <button style="font-size: 10px; background: #94a3b8; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer;" onclick="this.parentElement.parentElement.remove()">취소</button>
        </div>
      </div>
    `;
    item.insertAdjacentHTML('beforeend', editFormHTML);
  }

  function saveEdit(itemId) {
    const item = document.getElementById(itemId);
    const newAuthor = item.querySelector('.edit-nickname-input').value.trim();
    const newText = item.querySelector('.edit-text-input').value.trim();
    if (!newText) return alert('댓글 내용을 입력해주세요.');

    item.querySelector('.comment-author').textContent = newAuthor || '익명';
    item.querySelector('.comment-text').textContent = newText;
    item.querySelector('.edit-box').remove();
  }

  function deleteComment(itemId) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const item = document.getElementById(itemId);
    const parentComment = item.closest('.cute-comment-item:not([id^="reply-"])');
    const replyList = item.querySelector('.reply-list');

    if (replyList && replyList.children.length > 0) {
      item.setAttribute('data-deleted', 'true');
      item.querySelector('.comment-author').textContent = '알림';
      item.querySelector('.comment-text').innerHTML = '<i style="color: #94a3b8;">삭제된 댓글입니다.</i>';
      const actions = item.querySelector('.comment-actions');
      if (actions) actions.remove();
      const replyBtn = item.querySelector('.reply-btn');
      if (replyBtn) replyBtn.style.display = 'none';
    } else {
      const parentReplyList = item.parentElement;
      item.remove();
      if (parentComment && parentComment.getAttribute('data-deleted') === 'true') {
        if (parentReplyList.children.length === 0) parentComment.remove();
      }
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
