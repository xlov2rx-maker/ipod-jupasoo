<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>주파수의 iPod</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }

    /* 모바일 및 PC 완전 동일 중앙 정렬 레이아웃 */
    .ipod-body {
      width: 100%;
      max-width: 340px;
      height: 100%;
      max-height: 620px;
      background: linear-gradient(145deg, #ffffff, #dcdcdc);
      border-radius: 36px;
      padding: 16px 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #ccc;
      position: relative;
    }

    .ipod-screen {
      width: 100%;
      height: 52%;
      max-height: 300px;
      background: #ffffff;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden; 
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      position: relative;
    }

    .screen-header {
      background: linear-gradient(to bottom, #b0b0b0, #808080);
      color: white;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-icons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-icon {
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .screen-content {
      padding: 8px;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    .player-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
    }
    
    .thumbnail-box {
      width: 120px;
      height: 120px;
      margin: 0 auto 6px;
      border: 2px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
    .song-title { font-size: 11px; font-weight: bold; color: #222; margin-bottom: 2px; word-break: break-all; padding: 0 8px; line-height: 1.2; }
    .status-text { font-size: 9px; color: #666; margin-bottom: 2px; }

    .reaction-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 2px;
    }
    .reaction-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
    }

    .modal-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.98); z-index: 20; display: none;
      flex-direction: column; padding: 12px; justify-content: flex-start; gap: 8px;
    }
    .modal-overlay.active { display: flex; }
    .modal-title { font-size: 12px; font-weight: bold; text-align: center; color: #333; margin-bottom: 2px; }
    
    .modal-overlay input, .modal-overlay textarea {
      padding: 6px; font-size: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; outline: none;
    }
    .modal-overlay textarea { resize: none; height: 36px; }

    .modal-btns { display: flex; gap: 4px; margin-top: 2px; }
    .modal-btns button {
      flex: 1; padding: 6px; font-size: 10px; border: none; border-radius: 4px; cursor: pointer;
    }
    .btn-save { background: #007aff; color: white; }
    .btn-cancel { background: #8e8e93; color: white; }

    #comments-modal {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
    }

    .comments-modal-content {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .cute-title {
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      color: #0284c7;
      margin-bottom: 4px;
    }

    .cute-input-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid #bae6fd;
      box-shadow: 0 2px 6px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cute-input-container input, .cute-input-container textarea {
      border: 1px solid #7dd3fc;
      border-radius: 6px;
      padding: 4px 6px;
      background: #ffffff;
      font-size: 9px;
    }

    .cute-btn-save {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      font-weight: bold;
      border-radius: 6px;
    }

    .cute-btn-cancel {
      background: #94a3b8;
      color: white;
      border-radius: 6px;
    }
    
    .comment-list-scroll {
      flex: 1;
      overflow-y: auto;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }

    .cute-comment-item {
      background: #ffffff;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #bae6fd;
      box-shadow: 0 2px 4px rgba(186, 230, 253, 0.3);
      font-size: 9px;
    }

    .comment-header { display: flex; justify-content: space-between; align-items: center; }
    .comment-author-group { display: flex; align-items: center; gap: 4px; }
    .comment-author { font-weight: bold; color: #0369a1; }
    .comment-time { font-size: 8px; color: #94a3b8; }
    .comment-actions { display: flex; gap: 3px; }
    .comment-action-btn { font-size: 8px; color: #0284c7; cursor: pointer; background: none; border: none; font-weight: 600; }
    .comment-text { color: #334155; word-break: break-all; margin: 2px 0; font-size: 9px; }
    .reply-btn { font-size: 8px; color: #38bdf8; cursor: pointer; background: none; border: none; font-weight: bold; }
    .reply-list { margin-left: 6px; margin-top: 3px; border-left: 2px solid #7dd3fc; padding-left: 4px; }

    /* 클릭휠 UI 확대 및 중앙 배치 영역 */
    .wheel-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .click-wheel {
      width: 200px;
      height: 200px;
      background: #ffffff;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 6px 15px rgba(0,0,0,0.18), inset 0 0 10px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      touch-action: manipulation;
    }
    .wheel-btn { position: absolute; background: none; border: none; font-size: 13px; font-weight: bold; color: #555; cursor: pointer; user-select: none; }
    .btn-menu { top: 14px; left: 50%; transform: translateX(-50%); font-size: 11px; }
    .btn-prev { left: 14px; top: 50%; transform: translateY(-50%); }
    .btn-next { right: 14px; top: 50%; transform: translateY(-50%); }
    .btn-play-pause { bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 11px; }
    
    .center-button {
      width: 72px; height: 72px; background: linear-gradient(145deg, #e6e6e6, #ffffff);
      border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.22); border: 1px solid #ccc; cursor: pointer;
    }

    #sc-player-container { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
  </style>
</head>
<body>

<div class="ipod-body">
  <div class="ipod-screen">
    <div class="screen-header">
      <span>주파수의 ipod</span>
      <div class="header-icons">
        <span class="header-icon" onclick="openCommentsModal()" title="소통하기">💬</span>
        <span class="header-icon" onclick="openSettingsModal()" title="설정">⚙️</span>
      </div>
    </div>

    <!-- 1. 설정 모달 -->
    <div class="modal-overlay" id="settings-modal">
      <div id="auth-step">
        <div class="modal-title">🔒 비밀번호 입력</div>
        <input type="password" id="admin-pw-input" placeholder="비밀번호 입력">
        <div class="modal-btns">
          <button class="btn-save" onclick="checkPassword()">확인</button>
          <button class="btn-cancel" onclick="closeSettingsModal()">취소</button>
        </div>
      </div>

      <div id="settings-step" style="display: none;">
        <div class="modal-title">🎵 SoundCloud URL 입력</div>
        <input type="text" id="sc-url-input" placeholder="https://soundcloud.com/... 또는 모바일 공유 링크">
        <div class="modal-btns">
          <button class="btn-save" onclick="applyNewTrack()">적용하기</button>
          <button class="btn-cancel" onclick="closeSettingsModal()">닫기</button>
        </div>
      </div>
    </div>

    <!-- 2. 소통 모달 -->
    <div class="modal-overlay" id="comments-modal">
      <div class="comments-modal-content">
        <div class="cute-title">☁️ 소통 공간 ☁️</div>
        <div class="cute-input-container">
          <input type="text" id="nickname" placeholder="닉네임">
          <textarea id="comment-text" placeholder="예쁜 댓글을 남겨주세요..."></textarea>
          <div class="modal-btns">
            <button class="cute-btn-save" onclick="addComment()">작성</button>
            <button class="cute-btn-cancel" onclick="closeCommentsModal()">닫기</button>
          </div>
        </div>
        
        <div class="comment-list-scroll" id="comment-list"></div>
      </div>
    </div>

    <!-- 메인 플레이어 화면 -->
    <div class="screen-content">
      <div class="player-display">
        <div class="thumbnail-box">
          <img id="album-art" src="https://via.placeholder.com/150?text=SoundCloud" alt="Album Art">
        </div>
        <div class="song-title" id="song-title">노래 로딩 준비 중...</div>
        <div class="status-text" id="status-text">▶ 재생 로딩 중...</div>
      </div>

      <div class="reaction-bar">
        <button class="reaction-btn" onclick="toggleLike()">🖤 <span id="like-count">0</span></button>
      </div>
    </div>
  </div>

  <div class="wheel-container">
    <div class="click-wheel">
      <button class="wheel-btn btn-menu" onclick="openCommentsModal()">MENU</button>
      <button class="wheel-btn btn-prev" onclick="changeVolume(-10)" title="볼륨 줄이기">🔉</button>
      <button class="wheel-btn btn-next" onclick="changeVolume(10)" title="볼륨 키우기">🔊</button>
      <button class="wheel-btn btn-play-pause" onclick="togglePlayPause()">▶II</button>
      <div class="center-button" onclick="togglePlayPause()"></div>
    </div>
  </div>
</div>

<!-- SoundCloud API Iframe -->
<div id="sc-player-container">
  <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
</div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
  const ADMIN_PASSWORD = "0918";
  let widget;
  let isPlaying = false;
  let likes = 0;
  let currentVolume = 50;

  const DEFAULT_TRACK_URL = "https://soundcloud.com/forss/voodoo";
  
  // 모바일 LocalStorage 영구 저장 연동
  function getStoredTrack() {
    try {
      return localStorage.getItem("saved_ipod_track") || DEFAULT_TRACK_URL;
    } catch(e) {
      return DEFAULT_TRACK_URL;
    }
  }

  let currentTrackUrl = getStoredTrack();

  window.addEventListener('load', function() {
    const iframe = document.getElementById('sc-widget');
    iframe.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(currentTrackUrl)}&auto_play=true&show_artwork=true`;

    widget = SC.Widget(iframe);

    widget.bind(SC.Widget.Events.READY, function() {
      loadSingleTrack(currentTrackUrl, true);
      widget.setVolume(currentVolume);
      
      // 모바일 오디오 자동 재생 우회 실행
      tryPlayAudio();
    });

    widget.bind(SC.Widget.Events.PLAY, function() { isPlaying = true; updatePlayStatus(); });
    widget.bind(SC.Widget.Events.PAUSE, function() { isPlaying = false; updatePlayStatus(); });

    widget.bind(SC.Widget.Events.FINISH, function() {
      widget.seekTo(0);
      widget.play();
    });

    // 화면 아무 곳이나 처음 터치/클릭하는 순간 모바일 차단을 풀고 자동재생 실행
    const autoPlayTrigger = function() {
      tryPlayAudio();
      document.removeEventListener('touchstart', autoPlayTrigger);
      document.removeEventListener('click', autoPlayTrigger);
      document.removeEventListener('touchend', autoPlayTrigger);
    };

    document.addEventListener('touchstart', autoPlayTrigger, { passive: true, once: true });
    document.addEventListener('click', autoPlayTrigger, { passive: true, once: true });
    document.addEventListener('touchend', autoPlayTrigger, { passive: true, once: true });
  });

  function tryPlayAudio() {
    if (widget) {
      widget.play();
    }
  }

  function loadSingleTrack(trackUrl, autoPlay = true) {
    if (!widget) return;
    widget.load(trackUrl, {
      auto_play: autoPlay,
      callback: function() {
        if (autoPlay) widget.play();
        widget.getCurrentSound(function(currentSound) {
          if (currentSound) {
            document.getElementById('song-title').textContent = currentSound.title;
            const artwork = currentSound.artwork_url ? currentSound.artwork_url.replace('-large', '-t500x500') : 'https://via.placeholder.com/150?text=No+Art';
            document.getElementById('album-art').src = artwork;
          }
        });
      }
    });
  }

  function changeVolume(delta) {
    if (!widget) return;
    currentVolume = Math.min(100, Math.max(0, currentVolume + delta));
    widget.setVolume(currentVolume);

    const statusText = document.getElementById('status-text');
    statusText.textContent = `🔊 볼륨: ${currentVolume}%`;
    
    setTimeout(() => {
      updatePlayStatus();
    }, 1500);
  }

  function getFormattedDateTime() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    return `${yy}.${mm}.${dd} ${hh}:${min}`;
  }

  function openSettingsModal() {
    closeCommentsModal();
    document.getElementById('settings-modal').classList.add('active');
    document.getElementById('auth-step').style.display = 'block';
    document.getElementById('settings-step').style.display = 'none';
    document.getElementById('admin-pw-input').value = '';
  }

  function closeSettingsModal() {
    document.getElementById('settings-modal').classList.remove('active');
  }

  function checkPassword() {
    if (document.getElementById('admin-pw-input').value === ADMIN_PASSWORD) {
      document.getElementById('auth-step').style.display = 'none';
      document.getElementById('settings-step').style.display = 'block';
      document.getElementById('sc-url-input').value = currentTrackUrl;
    } else {
      alert('비밀번호가 올바르지 않습니다.');
    }
  }

  function applyNewTrack() {
    let url = document.getElementById('sc-url-input').value.trim();
    if (!url.includes('soundcloud.com')) {
      return alert('올바른 SoundCloud 링크를 입력해주세요.');
    }
    
    currentTrackUrl = url;
    try {
      localStorage.setItem("saved_ipod_track", currentTrackUrl);
    } catch (e) {
      console.warn("Storage save error", e);
    }
    
    loadSingleTrack(currentTrackUrl, true);
    closeSettingsModal();
    alert('노래가 성공적으로 변경되어 저장되었습니다!');
  }

  function openCommentsModal() {
    closeSettingsModal();
    document.getElementById('comments-modal').classList.add('active');
  }

  function closeCommentsModal() {
    document.getElementById('comments-modal').classList.remove('active');
  }

  function togglePlayPause() {
    if (widget) widget.toggle();
  }

  function updatePlayStatus() {
    document.getElementById('status-text').textContent = isPlaying ? '▶ 재생 중...' : '⏸ 일시정지됨 (버튼 클릭)';
  }

  function toggleLike() {
    likes++;
    document.getElementById('like-count').textContent = likes;
  }

  function addComment() {
    const nickname = document.getElementById('nickname').value.trim() || '익명';
    const text = document.getElementById('comment-text').value.trim();
    if (!text) return alert('댓글 내용을 입력해주세요.');

    const timeStr = getFormattedDateTime();
    const commentList = document.getElementById('comment-list');
    const commentId = 'comment-' + Date.now();
    const commentHTML = `
      <div class="cute-comment-item" id="${commentId}">
        <div class="comment-header">
          <div class="comment-author-group">
            <span class="comment-author">${escapeHtml(nickname)}</span>
            <span class="comment-time">${timeStr}</span>
          </div>
          <div class="comment-actions">
            <button class="comment-action-btn" onclick="editComment('${commentId}')">수정</button>
            <button class="comment-action-btn" onclick="deleteComment('${commentId}')">삭제</button>
          </div>
        </div>
        <div class="comment-text">${escapeHtml(text)}</div>
        <button class="reply-btn" onclick="showReplyBox('${commentId}')">답글 달기</button>
        <div class="reply-list"></div>
      </div>`;
    commentList.insertAdjacentHTML('afterbegin', commentHTML);
    document.getElementById('comment-text').value = '';
  }

  function showReplyBox(commentId) {
    const commentItem = document.getElementById(commentId);
    if (commentItem.querySelector('.reply-input-box')) return;
    const replyBoxHTML = `
      <div style="margin-top: 4px; display: flex; flex-direction: column; gap: 2px;" class="reply-input-box">
        <input type="text" class="reply-nickname" placeholder="닉네임" style="font-size: 8px; padding: 2px 4px;">
        <textarea class="reply-text" placeholder="답글 내용" style="font-size: 8px; height: 26px; padding: 2px 4px;"></textarea>
        <div style="display: flex; gap: 3px;">
          <button style="font-size: 8px; background: #38bdf8; color: white; border: none; padding: 2px 5px; border-radius: 4px; font-weight: bold;" onclick="addReply('${commentId}')">등록</button>
          <button style="font-size: 8px; background: #94a3b8; color: white; border: none; padding: 2px 5px; border-radius: 4px;" onclick="this.parentElement.parentElement.remove()">취소</button>
        </div>
      </div>`;
    commentItem.insertAdjacentHTML('beforeend', replyBoxHTML);
  }

  function addReply(commentId) {
    const commentItem = document.getElementById(commentId);
    const nickname = commentItem.querySelector('.reply-nickname').value.trim() || '익명';
    const text = commentItem.querySelector('.reply-text').value.trim();
    if (!text) return alert('답글 내용을 입력해주세요.');

    const timeStr = getFormattedDateTime();
    const replyList = commentItem.querySelector('.reply-list');
    const replyId = 'reply-' + Date.now();
    const replyHTML = `
      <div class="cute-comment-item" id="${replyId}" style="margin-top: 3px; border-color: #e0f2fe;">
        <div class="comment-header">
          <div class="comment-author-group">
            <span class="comment-author">${escapeHtml(nickname)}</span>
            <span class="comment-time">${timeStr}</span>
          </div>
          <div class="comment-actions">
            <button class="comment-action-btn" onclick="editComment('${replyId}')">수정</button>
            <button class="comment-action-btn" onclick="deleteComment('${replyId}')">삭제</button>
          </div>
        </div>
        <div class="comment-text">${escapeHtml(text)}</div>
      </div>`;
    replyList.insertAdjacentHTML('beforeend', replyHTML);
    commentItem.querySelector('.reply-input-box').remove();
  }

  function editComment(itemId) {
    const item = document.getElementById(itemId);
    const authorSpan = item.querySelector('.comment-author');
    const textDiv = item.querySelector('.comment-text');

    if (item.querySelector('.edit-box')) return;

    const currentAuthor = authorSpan.textContent;
    const currentText = textDiv.textContent;

    const editFormHTML = `
      <div class="edit-box" style="margin-top: 4px; display: flex; flex-direction: column; gap: 3px; background: #f0f9ff; padding: 5px; border-radius: 6px; border: 1px solid #7dd3fc;">
        <input type="text" class="edit-nickname-input" value="${escapeHtml(currentAuthor)}" style="font-size: 8px; padding: 2px 4px; border: 1px solid #bae6fd; border-radius: 4px;">
        <textarea class="edit-text-input" style="font-size: 8px; height: 28px; padding: 2px 4px; border: 1px solid #bae6fd; border-radius: 4px; resize: none;">${escapeHtml(currentText)}</textarea>
        <div style="display: flex; gap: 3px; margin-top: 2px;">
          <button style="font-size: 8px; background: #0284c7; color: white; border: none; padding: 2px 6px; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="saveEdit('${itemId}')">완료</button>
          <button style="font-size: 8px; background: #94a3b8; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer;" onclick="this.parentElement.parentElement.remove()">취소</button>
        </div>
      </div>
    `;

    item.insertAdjacentHTML('beforeend', editFormHTML);
  }

  function saveEdit(itemId) {
    const item = document.getElementById(itemId);
    const newAuthor = item.querySelector('.edit-nickname-input').value.trim();
    const newText = item.querySelector('.edit-text-input').value.trim();

    if (!newText) return alert('댓글 내용을 입력해주세요.');

    item.querySelector('.comment-author').textContent = newAuthor || '익명';
    item.querySelector('.comment-text').textContent = newText;
    item.querySelector('.edit-box').remove();
  }

  function deleteComment(itemId) {
    if (!confirm('정말 삭제하시겠습니까?')) return;

    const item = document.getElementById(itemId);
    const parentComment = item.closest('.cute-comment-item:not([id^="reply-"])');
    const replyList = item.querySelector('.reply-list');

    if (replyList && replyList.children.length > 0) {
      item.setAttribute('data-deleted', 'true');
      item.querySelector('.comment-author').textContent = '알림';
      item.querySelector('.comment-text').innerHTML = '<i style="color: #94a3b8;">삭제된 댓글입니다.</i>';
      
      const actions = item.querySelector('.comment-actions');
      if (actions) actions.remove();

      const replyBtn = item.querySelector('.reply-btn');
      if (replyBtn) replyBtn.style.display = 'none';

      const editBox = item.querySelector('.edit-box');
      if (editBox) editBox.remove();
    } else {
      const parentReplyList = item.parentElement;
      item.remove();

      if (parentComment && parentComment.getAttribute('data-deleted') === 'true') {
        const remainingReplies = parentReplyList.children.length;
        if (remainingReplies === 0) {
          parentComment.remove();
        }
      }
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</html>
